<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#101820">
<meta name="description" content="BUGIL CAMPUS LAB: 공개 사진 자료로 재구성한 북일고 3D 캠퍼스 시제품.">
<title>BUGIL CAMPUS LAB · v0.3</title>
<link rel="stylesheet" href="./styles.css">
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"}}</script>
</head>
<body>
<div id="world"></div>
<div class="topbar">
  <div class="brand"><div class="kicker">BUGIL · CAMPUS LAB</div><h1>북일고 3D 캠퍼스</h1><small>PHOTO-REFERENCED CONCEPT · v0.3</small></div>
  <div class="topright" id="views"><button data-view="campus" class="active">전체</button><button data-view="main">본관</button><button data-view="field">운동장</button><button data-view="dorm">기숙사</button></div>
</div>
<div class="panel">
  <div class="panelhead"><div class="mini">CAMPUS INDEX</div><h2>건물과 시설</h2><p>건물·도로·지형을 제공된 위성사진 표시를 기준으로 재구성한 개략 모델입니다.</p></div>
  <div class="facilitylist" id="facilities"></div>
  <div class="detail" id="detail">건물 이름을 누르면 해당 장소로 이동합니다.</div>
</div>
<div class="status"><div>모델링 진행 상태</div><b id="status-title">주요 건물 7동 · 지형</b><div id="status-sub">위치·비율은 사진 기반 추정치</div></div>
<div class="notice" id="notice"></div>
<div class="footnote">실측 3D 모델이 아닌 독립 제작 시제품 · 원본 사진과 지도 자료는 3D 장면에 포함하지 않음</div>
<div class="bottombar">
  <button class="tool active" id="inspect" aria-pressed="true"><span>⌖</span><b>건물 탐색</b></button>
  <button class="tool" id="detail-view"><span>▦</span><b>창문 보기</b></button>
  <button class="tool" id="labels"><span>▤</span><b>이름 표시</b></button>
  <button class="tool" id="compare"><span>◈</span><b>위에서 보기</b></button>
  <button class="tool" id="collapse"><span>▧</span><b>블록 분리</b></button>
  <button class="tool" id="restore"><span>↺</span><b>복구</b></button>
</div>
<div class="loading" id="loading"><div><b>BUGIL CAMPUS LAB</b><p>3D 캠퍼스를 구성하고 있습니다…</p></div></div>
<script>
window.addEventListener("error",function(e){const el=document.getElementById("loading");if(el){el.innerHTML="<div><b>3D 화면을 불러오지 못했습니다.</b><p>네트워크 연결과 Safari의 WebGL 지원 여부를 확인해 주세요.</p></div>";}},true);
setTimeout(function(){const el=document.getElementById("loading");if(el)el.innerHTML="<div><b>3D 라이브러리 연결 지연</b><p>페이지를 새로고침해 주세요.</p></div>"},20000);
</script>
<script type="module" src="./main.js"></script>
</body>
</html>
