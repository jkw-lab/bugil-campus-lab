name: Check live building-layer browser accessibility
on:
  push:
    branches: [feat/strict-geodata-only]
    paths: ['.github/workflows/check-gov-cors.yml']
permissions:
  contents: write
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Verify online building layer accepts browser origin
        run: |
          python3 - <<'PY'
          import json,urllib.request,urllib.parse,pathlib
          origin='https://bugil-campus-live.vercel.app'
          endpoint='https://portal.esrikr.com/arcgis/rest/services/MOIS_KR_Buildings_v2/FeatureServer/0/query'
          params={'f':'geojson','geometry':'127.1562,36.8288,127.1630,36.8346',
            'geometryType':'esriGeometryEnvelope','inSR':'4326','outSR':'4326',
            'spatialRel':'esriSpatialRelIntersects','where':'1=1',
            'outFields':'objectid,building_name,buld_nm_dc,gro_flo_co',
            'returnGeometry':'true','resultRecordCount':'2000'}
          r={'origin':origin,'endpoint':endpoint,'status':'failed','cors':'unverified','count':None}
          try:
            url=endpoint+'?'+urllib.parse.urlencode(params)
            req=urllib.request.Request(url,headers={'Origin':origin,'User-Agent':'BugilCampus/1.0 online-map-CORS-check'})
            with urllib.request.urlopen(req,timeout=35) as resp:
              a=resp.headers.get('Access-Control-Allow-Origin')
              raw=json.load(resp)
              r.update(status='ready',cors=a,count=len(raw.get('features',[])))
              r['browserCorsCompatible']=a in ('*',origin)
          except Exception as e: r['error']=str(e)
          pathlib.Path('geo/gov-live-health.json').write_text(json.dumps(r,ensure_ascii=False,indent=2),encoding='utf-8')
          print(json.dumps(r,ensure_ascii=False,indent=2))
          PY
      - name: Save only metadata, never building polygons
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add geo/gov-live-health.json
          if ! git diff --cached --quiet; then
            git commit -m 'test: record origin/CORS status without storing polygon geometry [skip ci]'
            git push
          fi
