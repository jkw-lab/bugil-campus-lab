name: Compare new dorm's actual OSM and official outlines
on:
  push:
    branches:
      - audit/dorm-new-footprints-20261103
    paths:
      - '.github/workflows/audit-dorm-new.yml'
permissions:
  contents: write
jobs:
  compare:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Analyze OSM vs official polygon overlaps online
        run: node tools/audit-dorm-new.mjs
      - name: Record aggregate measurements, not official source geometry
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add geo/dorm-new-audit-result.json
          if ! git diff --cached --quiet; then
            git commit -m 'audit: source geometry overlap metrics only [skip ci]'
            git push
          fi
